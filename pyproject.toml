[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "trajectory-audit"
version = "0.1.0"
description = "Audit whether agent-safety benchmarks can be predicted from partial trajectory views."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
guard = [
  "accelerate>=1.0,<2",
  "torch>=2.4",
  "transformers>=4.51,<6",
]

[project.scripts]
trajectory-audit = "trajectory_audit.cli:main"
trajectory-audit-additions = "trajectory_audit.additional_experiments_cli:main"
trajectory-capstone = "trajectory_audit.capstone_experiments:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trajectory_audit"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
